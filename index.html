<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Fernando Escobar" />
    <meta name="description" content="web projecr around  the us " />
    <meta name="keywords" content="around" />

    <link rel="stylesheet" href="./pages/index.css" />
    <title>Web Around</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/logo.svg"
          alt="logo arround the us"
          class="header__logo"
        />
      </header>
      <section class="profile">
        <div class="profile__frame">
          <img
            src="./images/avatar.jpg"
            alt="avatar de perfil"
            class="profile__avatar"
          />
        </div>
        <div class="profile__info">
          <h1 class="profile__name">Jacques Cousteau</h1>
          <p class="profile__title">Explorador</p>
          <div class="profile__edit_button">
            <img
              src="./images/edit.png"
              alt="icono de lapiz"
              class="profile__edit_icon"
            />
          </div>
        </div>
        <div class="profile__add_button">
          <img
            src="./images/add.png"
            alt="icono de mas"
            class="profile__add_icon"
          />
        </div>
      </section>
      <section class="elements">
        <div class="card">
          <img
            src="./images/yosemite.jpg"
            alt="foto del valle de yosemite"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Valle de Yosemite</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>

        <div class="card">
          <img
            src="./images/lago_louise.jpg"
            alt="foto del Lago Louise"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Lago Louise</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>

        <div class="card">
          <img
            src="./images/calvas.jpg"
            alt="foto de lass Montañas Calvas"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Montañas Calvas</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>
        <div class="card">
          <img
            src="./images/latemar.jpg"
            alt="foto de Latemar"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Latemar</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>

        <div class="card">
          <img
            src="./images/vanois.jpg"
            alt="foto del Parque Nacional de la Vanoise"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Parque nacional de la Vanoise</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>

        <div class="card">
          <img
            src="./images/lago_di_braies.jpg"
            alt="foto del Lago di Braies"
            class="card__image"
          />
          <div class="card__info">
            <p class="card__text">Lago di Braies</p>
            <img
              src="./images/like.png"
              alt="icono de corazon"
              class="card__like"
            />
          </div>
        </div>
      </section>
      <footer class="footer">
        <p class="footer__copyright">© 2024 Skondz</p>
      </footer>
    </div>
  </body>
</html>
