<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="web project around the U.S. " />
    <meta name="author" content="Fernando Escobar" />
    <meta name="keywords" content=" HTML, CSS, JavaScript, skondz, around" />
    <title>Web Around</title>
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="shortcut icon" href="./Favicon.ico" />
  </head>
  <body class="page">
    <header class="header">
      <img
        src="./images/logo_around.svg"
        alt="logo de la pagina around the us"
        class="header__logo"
      />
    </header>
    <main>
      <section class="profile">
        <div class="profile__frame">
          <img
            src="./images/avatar.svg"
            alt="foto de perfil"
            class="profile__avatar"
          />
        </div>
        <div class="profile__info">
          <h1 class="profile__name">Jacques Cousteau</h1>
          <img
            src="./images/icon_edit.svg"
            alt="Boton para editar perfil"
            class="profile__btn profile__btn_edit"
          />
          <p class="profile__job">Explorador</p>
        </div>
        <img
          src="./images/icon_add.svg"
          alt="Boton para agregar"
          class="profile__btn profile__btn_add"
        />
      </section>
      <section class="cards">
        <!-- card 1 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/yosemite.svg"
              alt="foto de Yosemite"
              class="card__image"
            />
            <p class="card__text">Valle de Yosemite</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
        <!-- card 2 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/lake_louise.svg"
              alt="foto del lago Louide"
              class="card__image"
            />
            <p class="card__text">Lago Louise</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
        <!-- card 3 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/bald_mountains.svg"
              alt="foto de las Montañas Calvas"
              class="card__image"
            />
            <p class="card__text">Montañas Calvas</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
        <!-- card 4 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/latemar.svg
            "
              alt="foto de Latemar"
              class="card__image"
            />
            <p class="card__text">Latemar</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
        <!-- card 5 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/vanoise_national_park.svg"
              alt="foto del parque nacional Vanoise"
              class="card__image"
            />
            <p class="card__text">Parque Nacional Vanoise</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
        <!-- card 6 -->
        <div class="card">
          <div class="card__container">
            <img
              src="./images/lake_di_braies.svg"
              alt="foto del Lago di Braies"
              class="card__image"
            />
            <p class="card__text">Lago di Braies</p>
            <img
              src="./images/icon_like.svg"
              alt="icono de like"
              class="card__btn_like"
            />
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__copyright">© 2024 Skondz</p>
    </footer>
    <div class="popup">
      <form class="popup__container">
        <img
          src="./images/icon_close.svg"
          alt="simbolo para cerrar"
          class="popup__btn_close"
        />
        <p class="popup__title">Editar perfil</p>
        <fieldset class="popup__fieldset">
          <input
            type="text"
            id="name"
            class="popup__input popup__input-name"
            placeholder="Nombre"
          />
          <input
            type="text"
            id="job"
            class="popup__input popup__input-job"
            placeholder="Acerca de mi"
          />
          <button class="popup__btn_save">Guardar</button>
        </fieldset>
      </form>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
