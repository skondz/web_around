<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="web project around the U.S. " />
    <meta name="author" content="Fernando Escobar" />
    <meta name="keywords" content=" HTML, CSS, JavaScript, skondz, around" />
    <title>Web Around</title>
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="shortcut icon" href="./favicon-road.ico" />
  </head>
  <body class="page">
    <header class="header">
      <img
        src="./images/logo_around.svg"
        alt="logo de la pagina around the us"
        class="header__logo"
      />
    </header>
    <main>
      <section class="profile">
        <div class="profile__frame">
          <img
            src="./images/avatar.svg"
            alt="foto de perfil"
            class="profile__avatar"
          />
        </div>
        <div class="profile__info">
          <h1 class="profile__name">Jacques Cousteau</h1>
          <img
            src="./images/icon_edit.svg"
            alt="Boton para editar perfil"
            class="profile__btn profile__btn_edit"
          />
          <p class="profile__job">Explorador</p>
        </div>
        <img
          src="./images/icon_add.svg"
          alt="Boton para agregar"
          class="profile__btn profile__btn_add"
        />
      </section>
      <section class="cards"></section>
    </main>
    <footer class="footer">
      <p class="footer__copyright">© 2024 Skondz</p>
    </footer>

    <!-- PopUps -->

    <!-- Profile -->

    <div class="popup popup_profile" id="popup_profile">
      <form class="popup__container">
        <img
          src="./images/icon_close.svg"
          alt="simbolo para cerrar"
          class="popup__btn_close"
          id="close_profile"
        />
        <p class="popup__title">Editar perfil</p>
        <fieldset class="popup__fieldset">
          <input
            type="text"
            id="profile-name"
            class="popup__input popup__input-name"
            placeholder="Nombre"
          />
          <input
            type="text"
            id="profile-job"
            class="popup__input popup__input-job"
            placeholder="Acerca de mi"
          />
          <button class="popup__btn popup__btn_save">Guardar</button>
        </fieldset>
      </form>
    </div>

    <!-- Add Card -->

    <div class="popup popup_add" id="popup_add">
      <form class="popup__container">
        <img
          src="./images/icon_close.svg"
          alt="simbolo para cerrar"
          class="popup__btn_close"
          id="close_add"
        />
        <p class="popup__title">Nuevo lugar</p>
        <fieldset class="popup__fieldset">
          <input
            type="text"
            id="add-title"
            class="popup__input popup__input-title"
            placeholder="Titulo"
          />
          <input
            type="url"
            id="add-link"
            class="popup__input popup__input-link"
            placeholder="Enlace a la imagen"
          />
          <button class="popup__btn popup__btn_create">Crear</button>
        </fieldset>
      </form>
    </div>

    <!-- Popup imagen -->
    <div class="popup popup_image" id="popup__image">
      <form class="popup__container popup__container-img">
        <img
          src="./images/icon_close.svg"
          alt="simbolo para cerrar"
          class="popup__btn_close"
          id="close_image"
        />
        <img src="" alt="" class="popup__link" />
        <p class="popup__text"></p>
      </form>
    </div>

    <!-- Template -->
    <template class="card__template">
      <div class="card__container">
        <img class="card__image" src="" alt="" />
        <img
          class="card__btn_delete"
          src="./images/icon_trash.svg"
          alt="icono de eliminar"
        />
        <p class="card__text"></p>
        <img
          class="card__btn_like"
          src="./images/icon_like.svg"
          alt="icono de like"
        />
      </div>
    </template>

    <script src="./scripts/script.js"></script>
  </body>
</html>
